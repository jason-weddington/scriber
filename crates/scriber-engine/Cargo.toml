[package]
name = "scriber-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scriber's dictation engine: scriber-core with the real microphone, Whisper, data folder and download, for any Rust app."
publish = false

[dependencies]
# The logic. A group of its own, so `cargo sort --grouped` keeps it first.
scriber-core = { path = "../scriber-core" }

# Audio capture from the default input device.
cpal = "0.18.2"
thiserror = "2"
# The speech model's download when it is missing: HTTPS, blocking, on a job
# thread. native-tls is Security.framework on macOS, so the download trusts
# the system's roots; ureq's default bundles Mozilla's (webpki-roots, under
# CDLA-Permissive-2.0, which deny.toml does not allow).
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default"] }
# whisper.cpp. Building it needs cmake. On macOS it runs on the GPU through
# Metal (the target table below); elsewhere on the CPU, so the workspace
# builds and gates on Linux.
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
